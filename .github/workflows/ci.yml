name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - eureka-server
          - user-service
          - wallet-service
          - transaction-service
          - notification-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      activemq:
        image: apache/activemq-classic:6.1.4
        ports:
          - 61616:61616
    env:
      EUREKA_CLIENT_ENABLED: "false"
      EUREKA_USER: ci
      EUREKA_PASSWORD: ci
      INTERNAL_SECRET: ci-internal-secret
      JWT_SECRET_KEY: ci-jwt-secret-key-only-for-github-actions-must-be-at-least-64-bytes-long-for-hs512
      QR_SECRET_KEY: ci-qr-secret-key
      DB_USER_URL: jdbc:postgresql://localhost:5432/ci
      DB_USER_USERNAME: ci
      DB_USER_PASSWORD: ci
      DB_WALLET_URL: jdbc:postgresql://localhost:5432/ci
      DB_WALLET_USERNAME: ci
      DB_WALLET_PASSWORD: ci
      DB_TRANSACTION_URL: jdbc:postgresql://localhost:5432/ci
      DB_TRANSACTION_USERNAME: ci
      DB_TRANSACTION_PASSWORD: ci
      DB_NOTIFICATION_URL: jdbc:postgresql://localhost:5432/ci
      DB_NOTIFICATION_USERNAME: ci
      DB_NOTIFICATION_PASSWORD: ci
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      ACTIVEMQ_BROKER_URL: tcp://localhost:61616
      SENDGRID_API_KEY: ci-sendgrid-api-key
      SENDGRID_FROM_EMAIL: ci@example.com
      SPEEDSMS_ACCESS_TOKEN: ci-speedsms-token
      SPEEDSMS_SENDER: ci
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: font-end
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: font-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api/v1
